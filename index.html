<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab');
            const cards = document.querySelectorAll('.card');
            const searchInput = document.getElementById('searchInput');

            function filterCards() {
                const activeCategory = document.querySelector('.tab.active').dataset.category;
                const searchTerm = searchInput.value.toLowerCase();

                cards.forEach(card => {
                    const matchesCategory = activeCategory === 'all' || card.dataset.category === activeCategory;
                    const matchesSearch = card.dataset.name.includes(searchTerm);
                    
                    if (matchesCategory && matchesSearch) {
                        card.classList.add('show');
                    } else {
                        card.classList.remove('show');
                    }
                });
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    filterCards();
                });
            });

            if(searchInput) {
                searchInput.addEventListener('input', filterCards);
            }

            // Handle slider dots pagination
            document.querySelectorAll('.image-slider').forEach(slider => {
                let isScrolling;
                slider.addEventListener('scroll', () => {
                    window.clearTimeout(isScrolling);
                    isScrolling = setTimeout(() => {
                        const index = Math.round(slider.scrollLeft / slider.clientWidth);
                        const dotsContainer = slider.nextElementSibling;
                        if(dotsContainer && dotsContainer.classList.contains('slider-dots')) {
                            const dots = dotsContainer.querySelectorAll('div');
                            dots.forEach((dot, i) => {
                                if (i === index) {
                                    dot.classList.replace('bg-white/50', 'bg-white/90');
                                    dot.classList.replace('opacity-50', 'opacity-100');
                                } else {
                                    dot.classList.replace('bg-white/90', 'bg-white/50');
                                    dot.classList.replace('opacity-100', 'opacity-50');
                                }
                            });
                        }
                    }, 50); // Debounce scroll event slightly
                });
            });
            
            // Lightbox functionality
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');

            if(lightbox && lightboxImg && lightboxClose) {
                document.querySelectorAll('.product-img').forEach(img => {
                    img.addEventListener('click', (e) => {
                        lightboxImg.src = e.target.src;
                        lightbox.classList.add('show');
                    });
                });

                lightboxClose.addEventListener('click', () => {
                    lightbox.classList.remove('show');
                });

                lightbox.addEventListener('click', (e) => {
                    if(e.target === lightbox) {
                        lightbox.classList.remove('show');
                    }
                });
            }
        });
    </script>
