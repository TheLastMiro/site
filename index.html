            `<div class="w-1.5 h-1.5 rounded-full ${index === 0 ? 'bg-white/90 opacity-100' : 'bg-white/50 opacity-50'} shadow-sm transition-opacity"></div>`
        ).join('');

        const cardHTML = `
        <div class="card show flex-col bg-surface rounded-xl overflow-hidden border border-border-light shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)]" data-category="${prod.category}">
            <div class="w-full aspect-[3/4] relative overflow-hidden group">
                <div class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar image-slider">
                    ${imagesHTML}
                </div>
                <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5 pointer-events-none slider-dots">
                    ${dotsHTML}
                </div>
            </div>
            <div class="p-3 flex flex-col flex-grow">
                <h2 class="font-label-bold text-sm text-primary mb-2 line-clamp-2 leading-tight">${prod.name}</h2>
                <div class="mt-auto">
                    <div class="flex items-baseline gap-1 mb-1">
                        <span class="font-bold text-[1.1rem] text-primary">${prod.price} руб.</span>
                        ${prod.unit ? `<span class="font-caption text-caption text-on-surface-variant">/ ${prod.unit}</span>` : ''}
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-secondary"></span>
                        <span class="text-secondary font-label-bold text-[10px] uppercase tracking-wider">В наличии</span>
                    </div>
                </div>
            </div>
        </div>
        `;
        catalogContainer.insertAdjacentHTML('beforeend', cardHTML);
    });
</script>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab');
            const cards = document.querySelectorAll('.card');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');

                    const filter = tab.dataset.category;

                    document.querySelectorAll('.card').forEach(card => {
                        if (filter === 'all' || card.dataset.category === filter) {
                            card.classList.add('show');
                        } else {
                            card.classList.remove('show');
                        }
                    });
                });
            });

            // Handle slider dots pagination
            document.querySelectorAll('.image-slider').forEach(slider => {
                let isScrolling;
                slider.addEventListener('scroll', () => {
                    window.clearTimeout(isScrolling);
                    isScrolling = setTimeout(() => {
                        const index = Math.round(slider.scrollLeft / slider.clientWidth);
                        const dotsContainer = slider.nextElementSibling;
                        if(dotsContainer && dotsContainer.classList.contains('slider-dots')) {
                            const dots = dotsContainer.querySelectorAll('div');
                            dots.forEach((dot, i) => {
                                if (i === index) {
                                    dot.classList.replace('bg-white/50', 'bg-white/90');
                                    dot.classList.replace('opacity-50', 'opacity-100');
                                } else {
                                    dot.classList.replace('bg-white/90', 'bg-white/50');
                                    dot.classList.replace('opacity-100', 'opacity-50');
                                }
                            });
                        }
                    }, 50); // Debounce scroll event slightly
                });
            });
        });
    </script>
</body></html>
